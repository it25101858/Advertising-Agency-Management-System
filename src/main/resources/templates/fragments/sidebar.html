<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activeTab)" class="sidebar">
    <div class="brand">
        <div class="brand-badge">AdFlow</div>
        <div>
            <h3 style="font-size:1.1rem;font-weight:700;">BrightWave</h3>
            <small style="color:var(--text-muted);">Enterprise Portal</small>
        </div>
    </div>
    <a th:href="@{/dashboard}" class="nav-link-item" th:classappend="${activeTab == 'dashboard'} ? 'active'">
        <span>📊</span> Dashboard
    </a>
    <a th:href="@{/appointments}" class="nav-link-item" th:classappend="${activeTab == 'appointments'} ? 'active'">
        <span>📅</span> Appointments
    </a>
    <a th:href="@{/campaigns}" class="nav-link-item" th:classappend="${activeTab == 'campaigns'} ? 'active'">
        <span>📢</span> Campaigns
    </a>
    <a th:href="@{/tasks}" class="nav-link-item" th:classappend="${activeTab == 'tasks'} ? 'active'">
        <span>📋</span> Tasks & Kanban
    </a>
    <a th:href="@{/assets}" class="nav-link-item" th:classappend="${activeTab == 'assets'} ? 'active'">
        <span>🖼️</span> Creative Assets
    </a>
    <a th:href="@{/feedback}" class="nav-link-item" th:classappend="${activeTab == 'feedback'} ? 'active'">
        <span>💬</span> Client Feedback
    </a>
    <a th:href="@{/invoices}" class="nav-link-item" th:classappend="${activeTab == 'invoices'} ? 'active'">
        <span>💳</span> Invoicing & Billing
    </a>
    <a th:href="@{/users}" class="nav-link-item" th:classappend="${activeTab == 'users'} ? 'active'">
        <span>🛡️</span> Users & Staff
    </a>
</aside>
</body>
</html>
