<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('My Profile')}"></head>
<body>
    <div class="dashboard-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>
        <div class="main-wrapper">
            <header th:replace="~{fragments/navbar :: navbar}"></header>
            <main class="content-body">
                <div class="glass-panel" style="max-width:600px; padding:32px;">
                    <h2>My Profile & Account</h2>
                    <p style="color:var(--text-secondary); margin-bottom:24px;">Manage your login credentials and personal details</p>
                    
                    <div class="form-group">
                        <label>Account Email</label>
                        <input type="text" id="profEmail" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>Assigned Role</label>
                        <input type="text" id="profRole" class="form-control" readonly>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/static/js/api/api-client.js}"></script>
    <script th:src="@{/static/js/ui.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const u = ApiClient.getCurrentUser();
            if (u) {
                document.getElementById('profEmail').value = u.email;
                document.getElementById('profRole').value = u.role;
            }
        });
    </script>
</body>
</html>
