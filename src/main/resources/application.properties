# ============================================================================
# AdFlow - Advertising Agency Management System
# Unified Core Application & Database Configuration
# ============================================================================
spring.application.name=advertising-agency-management-system
server.port=8080

# ----------------------------------------------------------------------------
# Database Configuration (MySQL 8.0+)
# Supports direct local credentials & environment variable overrides
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate Configurations
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# File Upload Multipart Configurations
# ----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/assets/

# ----------------------------------------------------------------------------
# Security & JWT Token Authentication
# ----------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------------------
# CORS Configuration (Local & Production Allowed Origins)
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:3000,https://adflow.brightwave.lk}

# ----------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# ----------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ----------------------------------------------------------------------------
# Logging Settings
# ----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.adflow=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
