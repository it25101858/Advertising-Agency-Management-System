<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Profile – AdFlow Enterprise">
    <title>My Profile • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/typography.css">
    <link rel="stylesheet" href="../../shared/styles/layout.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/utilities.css">
    <link rel="stylesheet" href="../../shared/styles/responsive.css">
    <link rel="stylesheet" href="../../features/users/users.css">
</head>
<body>
    <header class="app-header" id="app-header"></header>
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="content-area">

            <div class="page-header">
                <div class="page-title">
                    <h2>👤 My Profile</h2>
                    <p>Manage your account information and password</p>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start">

                <!-- Profile Card -->
                <div>
                    <div class="profile-header" style="text-align:center">
                        <div class="profile-avatar" id="profileAvatar" style="margin:0 auto">
                            <span id="profileInitials">?</span>
                        </div>
                        <div class="profile-name" id="profileName">Loading...</div>
                        <div class="profile-role" id="profileRole">—</div>
                    </div>

                    <div class="card" style="margin-top:16px">
                        <div class="card-title" style="margin-bottom:16px">Account Info</div>
                        <div style="display:flex;flex-direction:column;gap:12px">
                            <div style="display:flex;gap:10px;align-items:center">
                                <span style="font-size:1.1rem">📧</span>
                                <div><div style="font-size:0.75rem;color:var(--text-muted);font-weight:700;text-transform:uppercase">Email</div>
                                <div id="profileEmail" style="font-weight:600">—</div></div>
                            </div>
                            <div style="display:flex;gap:10px;align-items:center">
                                <span style="font-size:1.1rem">📞</span>
                                <div><div style="font-size:0.75rem;color:var(--text-muted);font-weight:700;text-transform:uppercase">Phone</div>
                                <div id="profilePhone" style="font-weight:600">—</div></div>
                            </div>
                            <div style="display:flex;gap:10px;align-items:center">
                                <span style="font-size:1.1rem">🏢</span>
                                <div><div style="font-size:0.75rem;color:var(--text-muted);font-weight:700;text-transform:uppercase">Organization</div>
                                <div id="profileCompany" style="font-weight:600">—</div></div>
                            </div>
                            <div style="display:flex;gap:10px;align-items:center">
                                <span style="font-size:1.1rem">📅</span>
                                <div><div style="font-size:0.75rem;color:var(--text-muted);font-weight:700;text-transform:uppercase">Joined</div>
                                <div id="profileJoined" style="font-weight:600">—</div></div>
                            </div>
                        </div>
                    </div>

                    <div class="card" style="margin-top:16px;text-align:center">
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px">System Module Access</div>
                        <div id="statModule" style="font-size:1.1rem;font-weight:800;color:var(--blue-electric)">—</div>
                        <div style="margin-top:8px">${Table.statusBadge ? '' : ''}</div>
                        <div class="badge badge-green" id="statStatus" style="margin-top:8px">Active</div>
                    </div>
                </div>

                <!-- Edit Forms -->
                <div style="display:flex;flex-direction:column;gap:20px">

                    <!-- Profile Edit Form -->
                    <div class="card">
                        <div class="card-title" style="margin-bottom:20px">✏️ Edit Profile</div>
                        <form id="profileForm" autocomplete="off">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" id="editName" class="form-control" placeholder="Your full name">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Email</label>
                                    <input type="email" id="editEmail" class="form-control" placeholder="your@email.com">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Phone</label>
                                    <input type="tel" id="editPhone" class="form-control" placeholder="+94 77 123 4567">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Company</label>
                                    <input type="text" id="editCompany" class="form-control" placeholder="Your organization">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>

                    <!-- Password Change Form -->
                    <div class="card">
                        <div class="card-title" style="margin-bottom:20px">🔑 Change Password</div>
                        <form id="passwordForm" autocomplete="new-password">
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" autocomplete="current-password">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">New Password</label>
                                    <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" autocomplete="new-password">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password" autocomplete="new-password">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-secondary">Update Password</button>
                            </div>
                        </form>
                    </div>

                    <!-- Danger Zone -->
                    <div class="card" style="border-color:var(--badge-red-border)">
                        <div class="card-title" style="margin-bottom:12px;color:var(--accent-red)">⚠ Session</div>
                        <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:16px">Sign out of your account across all devices.</p>
                        <button class="btn btn-danger" onclick="Sidebar.logout()">🚪 Sign Out Now</button>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <div id="toast-container"></div>

    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/date-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/utils/permission-utils.js"></script>
    <script src="../../shared/components/toast.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/table.js"></script>
    <script src="../../shared/components/navbar.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../features/users/users-api.js"></script>
    <script src="../../features/users/user-profile.js"></script>
</body>
</html>
