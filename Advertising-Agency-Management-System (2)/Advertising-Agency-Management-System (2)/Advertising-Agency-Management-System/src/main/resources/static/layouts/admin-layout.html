<!DOCTYPE html>
<html lang="en">
<!--
  AdFlow - Admin Layout Template
  Usage: Copy this file, set ACTIVE_MODULE and add your page-specific content
  in the <main> block and load your page scripts at the bottom.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles/variables.css">
    <link rel="stylesheet" href="../shared/styles/reset.css">
    <link rel="stylesheet" href="../shared/styles/typography.css">
    <link rel="stylesheet" href="../shared/styles/layout.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="stylesheet" href="../shared/styles/utilities.css">
    <link rel="stylesheet" href="../shared/styles/responsive.css">
    <!-- Page-specific CSS goes here -->
</head>
<body>

    <!-- Top Navbar -->
    <header class="app-header" id="app-header"></header>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <!-- Main Content -->
        <main class="content-area" id="main-content">

            <!-- ═══════════════════════════════════════════════════════════
                 Page content goes here
                 ═══════════════════════════════════════════════════════════ -->

            <div class="page-header">
                <div class="page-title">
                    <h2>Page Title</h2>
                    <p>Page subtitle / description</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" id="addBtn">+ Add New</button>
                </div>
            </div>

            <!-- Content area -->

        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Shared Scripts -->
    <script src="../shared/api/api-config.js"></script>
    <script src="../shared/api/api-client.js"></script>
    <script src="../shared/utils/storage-utils.js"></script>
    <script src="../shared/utils/format-utils.js"></script>
    <script src="../shared/utils/date-utils.js"></script>
    <script src="../shared/utils/validation-utils.js"></script>
    <script src="../shared/utils/permission-utils.js"></script>
    <script src="../shared/components/toast.js"></script>
    <script src="../shared/components/modal.js"></script>
    <script src="../shared/components/loader.js"></script>
    <script src="../shared/components/confirmation.js"></script>
    <script src="../shared/components/table.js"></script>
    <script src="../shared/components/pagination.js"></script>
    <script src="../shared/components/navbar.js"></script>
    <script src="../shared/components/sidebar.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ACTIVE_MODULE = ''; // Set this to the module name e.g. 'dashboard'
        if (!PermissionUtils.requireAuth()) return;
        Navbar.render();
        Navbar.init();
        Sidebar.render(ACTIVE_MODULE);
        Modal.init();
    });
    </script>
    <!-- Page-specific scripts go here -->
</body>
</html>
