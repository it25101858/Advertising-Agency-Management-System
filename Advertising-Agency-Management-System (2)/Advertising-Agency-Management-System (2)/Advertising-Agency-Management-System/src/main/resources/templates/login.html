<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign In • AdFlow Enterprise</title>
    <link rel="stylesheet" th:href="@{/static/css/main.css}">
    <link rel="stylesheet" th:href="@{/static/css/components.css}">
</head>
<body style="display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="glass-panel" style="width:100%; max-width:440px; padding:36px;">
        <div style="text-align:center; margin-bottom:28px;">
            <div style="display:inline-block; background:linear-gradient(135deg,var(--accent-blue),#7209b7); color:#fff; padding:8px 16px; border-radius:8px; font-weight:800; margin-bottom:12px;">AdFlow</div>
            <h2>Member Authentication</h2>
            <p style="color:var(--text-secondary); font-size:0.9rem;">Sign in with your BrightWave or Client credentials</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="e.g. admin@brightwave.lk" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Sign In &rarr;</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-secondary);">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>
        <div style="text-align:center; margin-top:12px;">
            <a th:href="@{/}" style="font-size:0.85rem; color:var(--text-muted);">&larr; Back to Home</a>
        </div>
    </div>

    <script th:src="@{/static/js/api/api-client.js}"></script>
    <script th:src="@{/static/js/api/auth-api.js}"></script>
    <script th:src="@{/static/js/utils.js}"></script>
    <script th:src="@{/static/js/auth.js}"></script>
</body>
</html>
