<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Account • AdFlow Enterprise</title>
    <link rel="stylesheet" th:href="@{/static/css/main.css}">
    <link rel="stylesheet" th:href="@{/static/css/components.css}">
</head>
<body style="display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="glass-panel" style="width:100%; max-width:480px; padding:36px;">
        <div style="text-align:center; margin-bottom:28px;">
            <div style="display:inline-block; background:linear-gradient(135deg,var(--accent-blue),#7209b7); color:#fff; padding:8px 16px; border-radius:8px; font-weight:800; margin-bottom:12px;">AdFlow</div>
            <h2>Client Registration</h2>
            <p style="color:var(--text-secondary); font-size:0.9rem;">Join the BrightWave client portal to manage campaigns</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Kasun Perera" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="kasun@dialog.lk" required>
            </div>
            <div class="form-group">
                <label>Company / Organization Name</label>
                <input type="text" id="companyName" class="form-control" placeholder="Dialog Axiata PLC">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="+94 77 123 4567">
            </div>
            <div class="form-group">
                <label>Password (Min. 6 characters)</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Complete Registration &rarr;</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-secondary);">
            Already have an account? <a th:href="@{/login}">Sign in here</a>
        </div>
    </div>

    <script th:src="@{/static/js/api/api-client.js}"></script>
    <script th:src="@{/static/js/api/auth-api.js}"></script>
    <script th:src="@{/static/js/utils.js}"></script>
    <script th:src="@{/static/js/auth.js}"></script>
</body>
</html>
