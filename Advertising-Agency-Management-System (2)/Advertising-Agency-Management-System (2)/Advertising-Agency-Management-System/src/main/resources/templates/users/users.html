<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('Staff & Users')}"></head>
<body>
    <div class="dashboard-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>
        <div class="main-wrapper">
            <header th:replace="~{fragments/navbar :: navbar}"></header>
            <main class="content-body">
                <div style="margin-bottom:24px;">
                    <h2>System Users & Staff Directory</h2>
                    <p style="color:var(--text-secondary);">Role-based accounts and staff privilege management.</p>
                </div>

                <div class="glass-panel table-container">
                    <table class="adflow-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Company</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="6" style="text-align:center;">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/static/js/api/api-client.js}"></script>
    <script th:src="@{/static/js/utils.js}"></script>
    <script th:src="@{/static/js/ui.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('usersTableBody');
            try {
                const res = await ApiClient.request('/users');
                if (res && res.data) {
                    tbody.innerHTML = res.data.map(u => `
                        <tr>
                            <td>#${u.userId}</td>
                            <td><strong>${u.fullName}</strong></td>
                            <td>${u.email}</td>
                            <td><span class="badge badge-active">${u.role}</span></td>
                            <td>${u.companyName || '-'}</td>
                            <td>${u.status}</td>
                        </tr>
                    `).join('');
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
