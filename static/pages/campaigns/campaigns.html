<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage advertising campaigns – AdFlow Enterprise">
    <title>Campaigns • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/typography.css">
    <link rel="stylesheet" href="../../shared/styles/layout.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/utilities.css">
    <link rel="stylesheet" href="../../shared/styles/responsive.css">
    <link rel="stylesheet" href="../../features/campaigns/campaigns.css">
</head>
<body>
    <header class="app-header" id="app-header"></header>
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="content-area">

            <div class="page-header">
                <div class="page-title">
                    <h2>📢 Campaigns</h2>
                    <p>Create and manage advertising campaigns</p>
                </div>
                <div class="page-header-actions" id="headerActions">
                    <button class="btn btn-primary" id="createBtn" onclick="CampaignForm.open()">+ Create Campaign</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:24px">
                <div class="stat-card blue"   style="padding:20px"><div class="stat-icon">📢</div><div class="stat-title">Total</div><div class="stat-value" id="statTotal">—</div></div>
                <div class="stat-card green"  style="padding:20px"><div class="stat-icon">✅</div><div class="stat-title">Active</div><div class="stat-value" id="statActive">—</div></div>
                <div class="stat-card amber"  style="padding:20px"><div class="stat-icon">⏳</div><div class="stat-title">Upcoming</div><div class="stat-value" id="statUpcoming">—</div></div>
                <div class="stat-card purple" style="padding:20px"><div class="stat-icon">💰</div><div class="stat-title">Total Budget</div><div class="stat-value" id="statBudget" style="font-size:1.4rem">—</div></div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <div class="search-wrap">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Campaign or client..." oninput="loadCampaigns()">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Status</label>
                    <select id="filterStatus" class="form-control" onchange="loadCampaigns()">
                        <option value="ALL">All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="UPCOMING">Upcoming</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="DRAFT">Draft</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <div class="filter-group" style="min-width:unset;flex:0">
                    <label class="filter-label">&nbsp;</label>
                    <button class="btn btn-ghost" onclick="document.getElementById('filterStatus').value='ALL';document.getElementById('searchInput').value='';loadCampaigns()">↺ Reset</button>
                </div>
            </div>

            <!-- Campaign Grid -->
            <div class="campaigns-grid" id="campaignGrid">
                <div class="campaign-card skeleton" style="height:220px"></div>
                <div class="campaign-card skeleton" style="height:220px"></div>
                <div class="campaign-card skeleton" style="height:220px"></div>
            </div>

        </main>
    </div>

    <!-- Campaign Modal -->
    <div class="modal-overlay" id="campaignModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Campaign</h3>
                <button class="modal-close" onclick="Modal.close('campaignModal')">×</button>
            </div>
            <div id="campaignModalBody"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="detailModalTitle">Campaign Details</h3>
                <button class="modal-close" onclick="Modal.close('detailModal')">×</button>
            </div>
            <div id="detailModalBody"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/date-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/utils/permission-utils.js"></script>
    <script src="../../shared/components/toast.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/confirmation.js"></script>
    <script src="../../shared/components/table.js"></script>
    <script src="../../shared/components/navbar.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../features/campaigns/campaigns-api.js"></script>
    <script src="../../features/campaigns/campaign-validation.js"></script>
    <script src="../../features/campaigns/campaign-form.js"></script>
    <script src="../../features/campaigns/campaigns.js"></script>
    <script>
    // Stats injector
    const _origLoadC = window.loadCampaigns;
    window.loadCampaigns = function() {
        _origLoadC?.();
        setTimeout(() => {
            const state = window.campaignState || [];
            const el = id => document.getElementById(id);
            if (el('statTotal'))    el('statTotal').textContent    = state.length;
            if (el('statActive'))   el('statActive').textContent   = state.filter(c=>c.status==='ACTIVE').length;
            if (el('statUpcoming')) el('statUpcoming').textContent = state.filter(c=>c.status==='UPCOMING').length;
            if (el('statBudget'))   el('statBudget').textContent   = FormatUtils.currencyCompact(state.reduce((s,c)=>s+(c.budget||0),0));
        }, 100);
    };
    </script>
</body>
</html>
