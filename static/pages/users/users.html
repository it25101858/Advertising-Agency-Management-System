<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Staff user management – AdFlow Enterprise">
    <title>Staff Accounts • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/typography.css">
    <link rel="stylesheet" href="../../shared/styles/layout.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/utilities.css">
    <link rel="stylesheet" href="../../shared/styles/responsive.css">
    <link rel="stylesheet" href="../../features/users/users.css">
</head>
<body>
    <header class="app-header" id="app-header"></header>
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="content-area">

            <div class="page-header">
                <div class="page-title">
                    <h2>🛡️ Staff Accounts</h2>
                    <p>Manage staff members, roles, and system access</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="openAddUserModal()">+ Add Staff Member</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <div class="search-wrap">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Name or email..." oninput="loadUsers()">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Role</label>
                    <select id="filterRole" class="form-control" onchange="loadUsers()">
                        <option value="ALL">All Roles</option>
                        <option value="ADMIN">Admin</option>
                        <option value="MANAGING_DIRECTOR">Managing Director</option>
                        <option value="APPOINTMENT_MANAGER">Appointment Manager</option>
                        <option value="CAMPAIGN_MANAGER">Campaign Manager</option>
                        <option value="TASK_MANAGER">Task Manager</option>
                        <option value="ASSET_MANAGER">Asset Manager</option>
                        <option value="FINANCE_MANAGER">Finance Manager</option>
                        <option value="CLIENT">Client</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Phone</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr></thead>
                        <tbody id="userTableBody">
                            <tr><td colspan="5" style="text-align:center;padding:40px">
                                <div class="spinner" style="margin:0 auto"></div>
                            </td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">🛡️ Add Staff Member</h3>
                <button class="modal-close" onclick="Modal.close('addUserModal')">×</button>
            </div>
            <div id="addUserModalBody"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/date-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/utils/permission-utils.js"></script>
    <script src="../../shared/components/toast.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/confirmation.js"></script>
    <script src="../../shared/components/table.js"></script>
    <script src="../../shared/components/navbar.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../features/users/users-api.js"></script>
    <script src="../../features/users/users.js"></script>
</body>
</html>
