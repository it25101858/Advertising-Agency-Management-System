<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task management – Kanban workflow – AdFlow Enterprise">
    <title>Tasks & Workflow • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/typography.css">
    <link rel="stylesheet" href="../../shared/styles/layout.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/utilities.css">
    <link rel="stylesheet" href="../../shared/styles/responsive.css">
    <link rel="stylesheet" href="../../features/tasks/tasks.css">
</head>
<body>
    <header class="app-header" id="app-header"></header>
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="content-area">

            <div class="page-header">
                <div class="page-title">
                    <h2>📋 Tasks & Workflow</h2>
                    <p>Manage creative tasks with Kanban board and list view</p>
                </div>
                <div class="page-header-actions">
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="btnKanban" onclick="switchView('kanban')">🗂 Kanban</button>
                        <button class="view-toggle-btn" id="btnList" onclick="switchView('list')">☰ List</button>
                    </div>
                    <button class="btn btn-primary" onclick="TaskForm.open()">+ New Task</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <div class="search-wrap">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Task, assignee..." oninput="loadTasks()">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Priority</label>
                    <select id="filterPriority" class="form-control" onchange="loadTasks()">
                        <option value="ALL">All Priorities</option>
                        <option value="CRITICAL">Critical</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Status</label>
                    <select id="filterStatus" class="form-control" onchange="loadTasks()">
                        <option value="ALL">All Statuses</option>
                        <option value="TODO">To Do</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="IN_REVIEW">In Review</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
            </div>

            <!-- Kanban View -->
            <div id="kanbanView">
                <div class="kanban-board" id="kanbanBoard">
                    <div class="kanban-column skeleton" style="height:300px"></div>
                    <div class="kanban-column skeleton" style="height:300px"></div>
                    <div class="kanban-column skeleton" style="height:300px"></div>
                    <div class="kanban-column skeleton" style="height:300px"></div>
                </div>
            </div>

            <!-- List View -->
            <div id="listView" class="d-none">
                <div class="table-container">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead><tr>
                                <th>#ID</th>
                                <th>Title</th>
                                <th>Campaign</th>
                                <th>Assignee</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Deadline</th>
                                <th>Actions</th>
                            </tr></thead>
                            <tbody id="taskTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="taskModalTitle">Task</h3>
                <button class="modal-close" onclick="Modal.close('taskModal')">×</button>
            </div>
            <div id="taskModalBody"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="detailModalTitle">Task Detail</h3>
                <button class="modal-close" onclick="Modal.close('detailModal')">×</button>
            </div>
            <div id="detailModalBody"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/date-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/utils/permission-utils.js"></script>
    <script src="../../shared/components/toast.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/confirmation.js"></script>
    <script src="../../shared/components/table.js"></script>
    <script src="../../shared/components/navbar.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../features/tasks/tasks-api.js"></script>
    <script src="../../features/tasks/kanban.js"></script>
    <script src="../../features/tasks/task-form.js"></script>
    <script src="../../features/tasks/tasks.js"></script>
</body>
</html>
