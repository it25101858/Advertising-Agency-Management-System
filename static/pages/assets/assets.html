<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creative asset library – AdFlow Enterprise">
    <title>Creative Assets • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/typography.css">
    <link rel="stylesheet" href="../../shared/styles/layout.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/utilities.css">
    <link rel="stylesheet" href="../../shared/styles/responsive.css">
    <link rel="stylesheet" href="../../features/assets/assets.css">
</head>
<body>
    <header class="app-header" id="app-header"></header>
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="content-area">

            <div class="page-header">
                <div class="page-title">
                    <h2>🖼️ Creative Assets</h2>
                    <p>Upload, version, and manage all creative deliverables</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="Modal.open('uploadModal')">⬆ Upload Asset</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <div class="search-wrap">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="form-control search-input" placeholder="Asset name, campaign..." oninput="loadAssets()">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Category</label>
                    <select id="filterCategory" class="form-control" onchange="loadAssets()">
                        <option value="ALL">All Categories</option>
                        <option value="3D_RENDER">3D Render</option>
                        <option value="PRINT_DESIGN">Print Design</option>
                        <option value="DIGITAL_MEDIA">Digital Media</option>
                        <option value="BRAND_ASSET">Brand Asset</option>
                        <option value="VIDEO_PRODUCTION">Video Production</option>
                        <option value="GENERAL">General</option>
                    </select>
                </div>
                <div class="filter-group" style="min-width:unset;flex:0">
                    <label class="filter-label">&nbsp;</label>
                    <button class="btn btn-ghost" onclick="document.getElementById('filterCategory').value='ALL';document.getElementById('searchInput').value='';loadAssets()">↺ Reset</button>
                </div>
            </div>

            <!-- Asset Grid -->
            <div class="asset-grid" id="assetGrid">
                <div class="asset-card skeleton" style="height:240px"></div>
                <div class="asset-card skeleton" style="height:240px"></div>
                <div class="asset-card skeleton" style="height:240px"></div>
            </div>

        </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">⬆ Upload Asset</h3>
                <button class="modal-close" onclick="Modal.close('uploadModal')">×</button>
            </div>
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="assetFile" accept="image/*,video/*,.pdf,.zip,.ai,.psd,.mp3">
                <div class="upload-icon">☁️</div>
                <div class="upload-title">Drag & Drop or Click to Browse</div>
                <div class="upload-hint">Supports images, video, PDF, AI, PSD, ZIP • Max 500MB</div>
            </div>
            <div id="uploadPreview" style="margin-top:12px"></div>
            <div class="form-row" style="margin-top:16px">
                <div class="form-group">
                    <label class="form-label">Campaign</label>
                    <input type="text" id="assetCampaign" class="form-control" placeholder="5G Mega Launch 2026">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="assetCategory" class="form-control">
                        <option value="GENERAL">General</option>
                        <option value="3D_RENDER">3D Render</option>
                        <option value="PRINT_DESIGN">Print Design</option>
                        <option value="DIGITAL_MEDIA">Digital Media</option>
                        <option value="BRAND_ASSET">Brand Asset</option>
                        <option value="VIDEO_PRODUCTION">Video Production</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-ghost" onclick="Modal.close('uploadModal');clearUpload()">Cancel</button>
                <button class="btn btn-primary" id="uploadBtn" onclick="uploadAsset()">⬆ Upload File</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="detailModalTitle">Asset Details</h3>
                <button class="modal-close" onclick="Modal.close('detailModal')">×</button>
            </div>
            <div id="detailModalBody"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/date-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/utils/permission-utils.js"></script>
    <script src="../../shared/components/toast.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/confirmation.js"></script>
    <script src="../../shared/components/table.js"></script>
    <script src="../../shared/components/navbar.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../features/assets/assets-api.js"></script>
    <script src="../../features/assets/upload.js"></script>
    <script src="../../features/assets/assets.js"></script>
</body>
</html>
