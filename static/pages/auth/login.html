<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to AdFlow – BrightWave Advertising Management Portal">
    <title>Sign In • AdFlow Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../features/auth/auth.css">
</head>
<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="auth-logo-badge">AdFlow</div>
            <div class="auth-logo-text">BrightWave Advertising (Pvt) Ltd<br>Enterprise Management Portal</div>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">🔒 Sign In</button>
            <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">📝 Create Account</button>
        </div>

        <!-- Global Alert -->
        <div class="auth-alert" id="authAlert"></div>

        <!-- ══ LOGIN FORM ══ -->
        <form id="loginForm" autocomplete="off" novalidate>

            <div class="auth-hint">
                <strong>Demo credentials:</strong> admin@brightwave.lk / Admin@123 &nbsp;|&nbsp;
                client@dialog.lk / password123
            </div>

            <div class="form-group">
                <label class="form-label" for="loginEmail">Email Address</label>
                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" id="loginEmail" class="form-control"
                           placeholder="Enter your email address" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="loginPassword" class="form-control"
                           placeholder="Min. 6 characters" autocomplete="current-password"
                           minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth" id="loginBtn">
                Sign In to Portal →
            </button>
        </form>

        <!-- ══ REGISTER FORM ══ -->
        <form id="registerForm" class="d-none" autocomplete="off" novalidate>

            <div class="form-group">
                <label class="form-label" for="regName">Full Name <span class="required">*</span></label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="regName" class="form-control"
                           placeholder="e.g. Kasun Perera" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" id="regEmail" class="form-control"
                           placeholder="e.g. kasun@dialog.lk" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regCompany">Company / Organization</label>
                <div class="input-wrap">
                    <span class="input-icon">🏢</span>
                    <input type="text" id="regCompany" class="form-control"
                           placeholder="e.g. Dialog Axiata PLC">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPhone">Phone Number</label>
                <div class="input-wrap">
                    <span class="input-icon">📞</span>
                    <input type="tel" id="regPhone" class="form-control"
                           placeholder="+94 77 123 4567">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="regPassword" class="form-control"
                           placeholder="Min. 6 characters" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth" id="registerBtn">
                Create Account →
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <a href="../../index.html">← Back to Home</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../shared/api/api-config.js"></script>
    <script src="../../shared/api/api-client.js"></script>
    <script src="../../shared/utils/storage-utils.js"></script>
    <script src="../../shared/utils/format-utils.js"></script>
    <script src="../../shared/utils/validation-utils.js"></script>
    <script src="../../shared/components/loader.js"></script>
    <script src="../../shared/components/modal.js"></script>
    <script src="../../features/auth/auth-api.js"></script>
    <script src="../../features/auth/auth-validation.js"></script>
    <script src="../../features/auth/auth.js"></script>
</body>
</html>
